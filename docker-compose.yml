services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_ops}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./hotel_ops.db}
    ports: ["8000:8000"]
    volumes: [./backend:/app]
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  qdrant_data:
  minio_data:
